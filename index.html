<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>소년체전 선발시드 평가전 · 경기 운영</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#1F4E3D;--g2:#2E7D4F;--lt:#EEF4F0;--ln:#dfe7e2;--tx:#2b322e;--mu:#6b7c74;--or:#D9822B;--red:#b23a2a;--bg:#f6f8f7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans KR",sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
header{background:var(--g);color:#fff;padding:16px 16px 0;position:sticky;top:0;z-index:20}
header h1{font-size:17px;font-weight:800;letter-spacing:-.3px}
header .sub{font-size:12px;opacity:.8;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700}
.b-admin{background:#B7D94C;color:var(--g)}.b-view{background:rgba(255,255,255,.18);color:#fff}
nav{display:flex;gap:2px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:#cfe0d6;text-decoration:none;font-size:14px;font-weight:700;padding:9px 12px;border-radius:10px 10px 0 0;white-space:nowrap}
nav a.on{background:var(--bg);color:var(--g)}
main{max-width:980px;margin:0 auto;padding:14px 12px 80px}
.note{background:#FFF7E0;border:1px solid #f0dca0;color:#7a5a00;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.err{background:#FDECEA;border-color:#f3c4bd;color:var(--red)}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:16px;font-weight:800;color:var(--g);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 small{font-weight:500;color:var(--mu);font-size:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button,.chip{border:1.5px solid var(--ln);background:#fff;border-radius:20px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--mu);cursor:pointer}
.seg button.on,.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.gymtitle{font-size:15px;font-weight:800;margin:4px 0 8px;display:flex;align-items:center;gap:8px}
.gA{background:#DCEBDD;color:#1F5E36}.gB{background:#FCE4CC;color:#9A4F0C}
.gtag{padding:2px 8px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap}
.btn{white-space:nowrap}
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.court{border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px;background:#fff;min-height:118px;display:flex;flex-direction:column}
.court.live{border-color:var(--g2);background:#F3FAF5}
.court .ch{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mu);font-weight:700;margin-bottom:6px}
.court .ch .lv{color:var(--g2)}
.pl{display:flex;align-items:baseline;gap:5px;font-size:16px;font-weight:700;color:#333}
.pl .t{font-size:11px;font-weight:700}
.vs{font-size:11px;color:#9aa8a1;margin:1px 0 1px 2px}
.btns{display:flex;gap:6px;margin-top:auto;padding-top:8px}
.btn{border:0;border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;background:var(--lt);color:var(--g)}
.btn.pri{background:var(--g);color:#fff}.btn.warn{background:#FDECEA;color:var(--red)}.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.empty{color:#a3b0aa;font-size:13px;margin:auto 0;text-align:center}
.queue{margin-top:10px}
.qrow{display:flex;align-items:center;gap:8px;padding:8px 2px;border-top:1px solid #eef2f0;font-size:14px}
.qrow .n{width:22px;height:22px;border-radius:50%;background:var(--lt);color:var(--g);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.qrow .who{flex:1;min-width:0}
.nm{font-weight:700;color:#333}.tm{font-size:11px;font-weight:700;margin-left:2px}
.warn-t{font-size:11px;color:var(--or);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--lt);color:var(--g);font-size:12px;font-weight:800;padding:8px 6px;text-align:center;white-space:nowrap;position:sticky;top:0}
td{border-bottom:1px solid #eef2f0;padding:8px 6px;text-align:center}
td.l{text-align:left}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.st{font-size:11px;font-weight:800;padding:2px 7px;border-radius:8px;white-space:nowrap}
.st-w{background:#eef1f0;color:#7b8a83}.st-l{background:#DCEFE2;color:var(--g2)}.st-d{background:var(--g);color:#fff}
.win{color:var(--g2);font-weight:800}
.wl{display:inline-block;font-size:11px;font-weight:800;padding:0 6px;border-radius:7px;margin-left:4px;vertical-align:1px}
.wl.w{background:#2E7D4F;color:#fff}.wl.l{background:#e9eeec;color:#7b8a83}
.side{white-space:nowrap}.lose{color:#9aa8a1}
.rk1{background:#FFF6D6}.rk2{background:#F1F3F4}.rk3{background:#FBE9DA}
.rk{font-weight:800;color:var(--g)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
input[type=search],select{border:1.5px solid var(--ln);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;background:#fff}
input[type=search]{flex:1;min-width:140px}
.modal{position:fixed;inset:0;background:rgba(20,30,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .box{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px 24px;max-height:88vh;overflow:auto}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:18px}}
.modal h3{font-size:17px;font-weight:800;color:var(--g);margin-bottom:12px}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:8px 0 14px}
.score .side{text-align:center}
.score input{width:100%;font-size:30px;font-weight:800;text-align:center;border:2px solid var(--ln);border-radius:12px;padding:10px 0;font-family:inherit}
.score .colon{font-size:26px;font-weight:800;color:#9aa8a1}
.quick{display:flex;gap:6px;justify-content:center;margin-top:6px}
.quick button{border:1px solid var(--ln);background:#fff;border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;color:var(--g);cursor:pointer}
.mrow{display:flex;gap:8px;margin-top:6px}
.mrow .btn{flex:1;padding:12px}
.small{font-size:12px;color:var(--mu)}
.prog{height:8px;background:#e6ece9;border-radius:6px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--g2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;font-weight:700;margin-top:6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#233;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.pick{border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:6px;display:flex;align-items:center;gap:10px;cursor:pointer;background:#fff;width:100%;text-align:left;font:inherit}
.pick:hover{background:var(--lt)}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.statgrid div{background:var(--lt);border-radius:10px;padding:8px;text-align:center}
.statgrid b{display:block;font-size:20px;color:var(--g)}
.statgrid span{font-size:11px;color:var(--mu)}
.lunch{background:#FDECEA;color:var(--red);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;margin-bottom:12px}

.tt-card{padding:12px 8px}
.ttwrap{margin:0 -4px}
table.tt{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
table.tt th{position:sticky;top:0;z-index:2}
table.tt th.tcol{left:0;z-index:3;background:var(--lt);min-width:46px}
table.tt tr th.tcol{position:sticky;left:0}
table.tt td{border:0;border-bottom:1px solid #eef2f0;border-right:1px solid #f1f4f2;padding:4px 5px;text-align:left;vertical-align:top;min-width:84px}
table.tt td.e{background:#fafbfa}
table.tt td.cell{cursor:default}
table.tt td.cell.fin{background:#F7FBF8}
table.tt td.cell.live{background:#E8F5EC;box-shadow:inset 0 0 0 2px #2E7D4F}
table.tt td.cell.hit{background:#FFF4D6;box-shadow:inset 0 0 0 2px #E0B341}
table.tt td.cell.dim{opacity:.35}
table.tt .ln{display:flex;align-items:baseline;gap:3px;white-space:nowrap;line-height:1.35}
table.tt .ln .nm{font-size:13px;font-weight:700;color:#3a3f3c}
table.tt .ln .tm{font-size:10px}
table.tt .ln .sc{margin-left:auto;font-size:13px;padding-left:6px}
table.tt .ln.wn .nm,table.tt .ln.wn .sc{color:#1F6B3F}
table.tt .ln.wn .nm::after{content:"승";font-size:9px;background:#2E7D4F;color:#fff;border-radius:5px;padding:0 4px;margin-left:3px;vertical-align:1px}
table.tt .ln.ls .nm,table.tt .ln.ls .sc{color:#9aa8a1}
table.tt .lvt{font-size:10px;color:var(--g2);font-weight:800}
table.tt tr.lu td{background:#FDECEA;color:var(--red);font-weight:800;font-size:12px;text-align:center;padding:7px}
.hbtn{margin-left:auto;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:3px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.pwin{width:100%;font-size:18px;padding:12px;border:2px solid var(--ln);border-radius:12px;font-family:inherit;margin:6px 0 4px}
.no{display:inline-block;min-width:26px;padding:0 5px;border-radius:7px;background:#1F4E3D;color:#fff;font-size:11px;font-weight:800;text-align:center;margin-right:4px;vertical-align:1px}
.no.dn{background:#c9d3ce}
table.tt .cno{font-size:10px;font-weight:800;color:#7b8a83;margin-bottom:1px}
table.tt td.cell.adm{cursor:pointer}
table.tt .edit{display:inline-block;margin-top:3px;font-size:10px;font-weight:800;color:#fff;background:#D9822B;border-radius:6px;padding:1px 6px}
table.tt .edit.re{background:#e9eeec;color:#5d6b64}
table.tt td.cell.adm:hover{background:#FFF4E6}
.adminbar{background:#FFF1E0;border:1.5px solid #F2C38F;color:#8a4b0c;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;margin-bottom:8px}
.pk{display:flex;align-items:center;gap:8px;border:1px solid var(--ln);border-radius:10px;padding:9px 10px;margin-bottom:5px;background:#fff;width:100%;text-align:left;font:inherit;cursor:pointer}
.pk:hover{background:var(--lt)}.pk:disabled{cursor:default;background:#f6f8f7;opacity:.6}
.pk .why{font-size:11px;font-weight:700;color:var(--mu);white-space:nowrap}
.pk.rec{border-color:#2E7D4F;box-shadow:inset 0 0 0 1px #2E7D4F}
.daytitle{font-size:15px;font-weight:800;color:var(--g);margin:14px 2px 8px}
.pcard .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pcard .ph b{font-size:20px}
.pteams{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pnames{display:flex;gap:6px;flex-wrap:wrap}
table.pt td{font-size:13px;white-space:nowrap;padding:8px 4px}
table.pt tr.dh td{background:var(--lt);color:var(--g);font-weight:800;text-align:left;font-size:13px}
table.pt tr.mv td{background:#FDECEA;color:var(--red);font-weight:800;font-size:12px;text-align:left}
.vids{margin:22px 0 4px}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.promo{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--tx);background:#fff;border:1px solid var(--ln);border-radius:12px;padding:6px}
.promo:hover{background:var(--lt)}
.pthumb{position:relative;display:block;border-radius:8px;overflow:hidden;aspect-ratio:16/9;background:#dfe7e2}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;left:50%;top:50%;width:30px;height:21px;margin:-10px 0 0 -15px;background:#e62117;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.play::after{content:"";position:absolute;left:12px;top:6px;border-left:8px solid #fff;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.ptxt{display:flex;align-items:center;gap:6px;padding:0 2px 2px}
.plogo{width:20px;height:20px;border-radius:50%;background:#fff;border:1px solid var(--ln);flex:none}
.ptxt b{font-size:12px;font-weight:800;white-space:nowrap}
.vfoot{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0 6px;text-decoration:none;color:var(--g)}
.vfoot img{width:30px;height:30px;border-radius:50%;border:1px solid var(--ln);background:#fff}
.vfoot b{font-size:15px;font-weight:800}
</style></head>
<body>
<header>
  <h1>소년체전 경기도대표 선발시드 평가전</h1>
  <div class="sub"><span>남자초등부 단식 · 31점 1세트</span><span id="role" class="badge b-view">보기 전용</span><span id="sync"></span><button id="loginBtn" class="hbtn" onclick="adminBtn()">관리자</button></div>
  <nav id="nav">
    <a href="#court" data-v="court">코트 현황</a><a href="#list" data-v="list">타임테이블</a><a href="#player" data-v="player">선수별 시간표</a><a href="#rank" data-v="rank">순위</a><a href="#self" data-v="self">교내 평가전</a><a href="#info" data-v="info">안내</a>
  </nav>
</header>
<main id="app"></main>
<div id="modal"></div>
<div class="toast" id="toast"></div>

function standings(){
  const S={};PLAYERS.forEach(p=>S[p]={p,g:0,w:0,l:0,f:0,a:0});
  for(const m of (INC_SELF?ALL:D.matches)){if(!done(m.id))continue;const r=R[m.id];const A=S[m.a],B=S[m.b];
    A.g++;B.g++;A.f+=r.sa;A.a+=r.sb;B.f+=r.sb;B.a+=r.sa;if(r.sa>r.sb){A.w++;B.l++}else{B.w++;A.l++}}

  arr.sort((x,y)=>y.w-x.w||y.d-x.d||y.f-x.f||x.p.localeCompare(y.p,'ko'));
  let rank=0,prev=null;arr.forEach((s,i)=>{const k=s.w+'|'+s.d+'|'+s.f;if(k!==prev){rank=i+1;prev=k}s.r=s.g?rank:null});return arr;
}

async function write(id,data){

    if(r.error){ if(/password/.test(r.error.message)){logout();toast('비밀번호가 바뀌었거나 틀렸습니다. 다시 로그인해 주세요')} else toast('저장 실패, 다시 시도해 주세요'); return false}

  <div class="score"><div class="side"><div class="pl" style="justify-content:center">${nm(m.a)}</div><input id="sa" type="number" inputmode="numeric" min="0" max="99" value="${sa}"><div class="quick"><button onclick="q31('sa')">31점</button></div></div>
  <div class="colon">:</div><div class="side"><div class="pl" style="justify-content:center">${nm(m.b)}</div><input id="sb" type="number" inputmode="numeric" min="0" max="99" value="${sb}"><div class="quick"><button onclick="q31('sb')">31점</button></div></div></div>

  setTimeout(()=>{const e=document.getElementById(sa===''?'sa':'sb');e&&e.focus()},50);
}
function q31(k){document.getElementById(k).value=31}
async function saveScore(id){
  const a=parseInt(document.getElementById('sa').value,10),b=parseInt(document.getElementById('sb').value,10),er=document.getElementById('serr');
  if(!Number.isFinite(a)||!Number.isFinite(b)||a<0||b<0){er.textContent='두 선수 점수를 모두 입력해 주세요.';return}
  if(a===b){er.textContent='동점은 입력할 수 없습니다.';return}
  const m=byId[id],r=R[id]||{};
  const data={st:'done',sa:a,sb:b,end:r.end&&r.st==='done'?r.end:Date.now()};
  if(r.gym!=null)data.gym=r.gym; if(r.court!=null)data.court=r.court; if(r.start)data.start=r.start;
  if(!m.self&&data.gym==null)data.gym=m.gym;
  closeModal(); if(await write(id,data)) toast('저장했습니다');
}

let refT=null;

    const [a,c]=await Promise.all([SB.from('results').select('id,st,gym,court,start_at,end_at,sa,sb'),SB.from('config').select('seg,rest').eq('k','main').maybeSingle()]);
    if(a.error)throw a.error;
    const n={};(a.data||[]).forEach(x=>{if(byId[x.id])n[x.id]={st:x.st,gym:x.gym,court:x.court,start:x.start_at==null?null:Number(x.start_at),end:x.end_at==null?null:Number(x.end_at),sa:x.sa,sb:x.sb}});

  if(!document.getElementById('modal').innerHTML)render();
}
function scheduleLoad(){clearTimeout(refT);refT=setTimeout(loadAll,300)}
